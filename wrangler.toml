name = "ifs-passcode-relay"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "ifspasscoderelay.grifwl.blue", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "ifs-passcode-relay"
database_id = "REPLACE_WITH_OUTPUT_OF_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[observability]
enabled = true
