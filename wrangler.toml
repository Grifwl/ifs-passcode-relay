name = "ifs-passcode-relay"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "ifspasscoderelay.grifwl.blue", custom_domain = true }
]

# Static files (currently just logo.png) served directly by Cloudflare
# for any request path that matches a file here — the Worker's own
# fetch handler only ever sees paths that don't match one of these, so
# routes like "/" stay dynamic (see src/index.ts).
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "ifs-passcode-relay"
database_id = "d8aca9d6-3878-4063-be2b-778e4f504141"
migrations_dir = "migrations"

[observability]
enabled = true
